reference:
  - title: "Package Overview"
    contents:
      - egpd-package

  - title: "Model Fitting"
    desc: "Main function for fitting EGPD, DEGPD, and ZIDEGPD GAMs."
    contents:
      - egpd

  - title: "Univariate Fitting"
    desc: "Maximum likelihood and Bernstein polynomial fitting of univariate EGPD distributions."
    contents:
      - distfit
      - plot.distfit
      - confint.distfit

  - title: "Multiscale Aggregated Models"
    desc: "Composite-likelihood fitting across aggregation durations for continuous and discrete compound Poisson EGPD models, with a moving-block bootstrap."
    contents:
      - matches("aggregate_egpd")

  - title: "Spliced, Threshold and Hurdle Count Models"
    desc: "Bulk quantile regression plus DEGPD tail modeling, discrete-GPD peaks over threshold, and hurdle count GAMs."
    contents:
      - fit_spliced_degpd
      - fit_degpd_pot
      - matches("hurdle")

  - title: "Prediction and Methods"
    desc: "S3 methods for fitted egpd objects."
    contents:
      - predict.egpd
      - fitted.egpd
      - simulate.egpd
      - logLik.egpd
      - ginv.egpd
      - plot.egpd
      - summary.egpd
      - vcov.egpd
      - confint.egpd
      - print.egpd
      - nobs.egpd
      - predictive_coverage

  - title: "EGPD Distributions"
    desc: "Continuous Extended Generalized Pareto Distribution functions."
    contents:
      - pegpd
      - degpd_density
      - qegpd
      - regpd

  - title: "Blended GP Distributions"
    desc: "Paper-style bulk/tail blends with exact GP upper tails."
    contents:
      - bgpd
      - pbgpd
      - dbgpd
      - qbgpd
      - rbgpd

  - title: "Composite Pareto Distributions"
    desc: "Continuous composite Pareto distributions and GAM family support."
    contents:
      - dcomppareto
      - pcomppareto
      - qcomppareto
      - rcomppareto

  - title: "Discrete EGPD Distributions"
    desc: "Discrete Extended Generalized Pareto Distribution functions."
    contents:
      - ddiscegpd
      - pdiscegpd
      - qdiscegpd
      - rdiscegpd

  - title: "Zero-Inflated Discrete EGPD Distributions"
    desc: "Zero-inflated discrete EGPD distribution functions."
    contents:
      - dzidiscegpd
      - pzidiscegpd
      - qzidiscegpd
      - rzidiscegpd

  - title: "Zero-Inflated Continuous EGPD Distributions"
    desc: "Zero-inflated continuous EGPD distribution functions."
    contents:
      - dziegpd
      - pziegpd
      - qziegpd
      - rziegpd

  - title: "Compound Poisson EGPD Distributions"
    desc: "Compound Poisson EGPD distribution functions for aggregated data."
    contents:
      - dcpegpd
      - pcpegpd
      - qcpegpd
      - rcpegpd

  - title: "Compound Poisson-Discrete EGPD Distributions"
    desc: "Exact compound Poisson-Discrete EGPD distribution functions for integer-valued aggregated data."
    contents:
      - dcpdegpd
      - pcpdegpd
      - qcpdegpd
      - rcpdegpd

  - title: "Overdispersed Count Distributions"
    desc: "Count families that can be fitted with egpd(), distfit(), gamlss and bamlss."
    contents:
      - bell
      - zibell
      - pig
      - zipig
      - gpig
      - zigpig
      - gpig_control
      - cmp
      - prl
      - gpois
      - gwaring
      - poislnorm

  - title: "Bivariate BEGPD"
    desc: "Bivariate Extended Generalized Pareto Distribution and discrete extensions via neural Bayes estimation."
    contents:
      - rbegpd
      - train_begpd
      - rbdegpd
      - rbzidegpd
      - train_bdegpd

  - title: "Bivariate MDGPD"
    desc: "[Experimental] Multivariate Discrete GPD (Aka-Kratz-Naveau) via neural Bayes estimation."
    contents:
      - rmdgpd
      - rzimdgpd
      - train_mdgpd

  - title: "Diagnostics"
    desc: "Model diagnostic tools."
    contents:
      - rqresid

  - title: "gamlss Families"
    desc: "Family constructors and d/p/q/r wrappers for fitting EGPD models with gamlss."
    contents:
      - EGPD1
      - EGPD3
      - EGPD4
      - EGPD5
      - EGPD6
      - DEGPD1
      - DEGPD3
      - DEGPD4
      - DEGPD5
      - DEGPD6
      - ZIEGPD1
      - ZIEGPD3
      - ZIEGPD5
      - ZIEGPD6
      - ZIDEGPD1
      - ZIDEGPD3
      - ZIDEGPD5
      - ZIDEGPD6

  - title: "bamlss Families"
    desc: "Family constructors for fitting EGPD and count models with bamlss."
    contents:
      - egpd_bamlss
      - ziegpd_bamlss
      - degpd_bamlss
      - zidegpd_bamlss
      - bell_bamlss
      - zibell_bamlss
      - pig_bamlss
      - zipig_bamlss
      - gpig_bamlss
      - zigpig_bamlss

  - title: "G-function Utilities"
    desc: "Transformation functions for the EGPD G-function (types 1--6)."
    contents:
      - p.G
      - d.G
      - q.G
      - r.G

  - title: "Helpers"
    desc: "Utility functions."
    contents:
      - dfbind
      - pinv
      - seq_between

  - title: "Datasets"
    desc: "Example datasets included in the package."
    contents:
      - ny_complaints
      - docvisits
      - nsw_offenses
